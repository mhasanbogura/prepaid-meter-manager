<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Meter Manager – Bangladesh prepaid electricity meter manager. Check DESCO prepaid meter balance, daily/monthly consumption, recharge history and recharge via ekPay.">
    <meta name="theme-color" content="#0b3d91">
    <title>Meter Manager</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-317.png">
<link rel="apple-touch-icon" href="icons/icon-317.png">
<link rel="preconnect" href="https://prepaid.desco.org.bd">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app" class="app">

  <header class="topbar">

        <strong data-i18n="app.name">Meter Manager</strong>
        <div class="brand-sub">Build by Mahmudul</div>
      </div>
    </div>
    <button id="btnRefreshAll" class="icon-btn" aria-label="Refresh" title="Refresh">
      <svg id="refreshIcon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
    <button id="btnSettings" class="icon-btn" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1115.6 12 3.61 3.61 0 0112 15.6z"/></svg>
    </button>
  </header>

  <main id="view-home" class="view">
    <div id="homeContent" class="home-content"></div>
  </main>

  <main id="view-settings" class="view" style="display:none">
    <div id="settingsContent" class="home-content"></div>
  </main>

  <div id="toast" class="toast" hidden></div>

  <div id="dlg" class="dialog-wrap" hidden>
    <div class="dialog">
      <h3 id="dlgTitle"></h3>
      <div id="dlgBody"></div>
      <div id="dlgActions" class="dialog-actions"></div>
    </div>
  </div>
</div>
<script src="js/app.js?v=438"></script>
</body>
</html>
